[project]
name = "advrl"
version = "0.0.0"
description = "advrl"
requires-python = "==3.12.4"
dependencies = [
  "gymnasium"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["advrl*"]
[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0402","B905","PLR0912","PLR0915"]
[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff]
line-length = 110